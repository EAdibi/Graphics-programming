
<!DOCTYPE html>
<html>
    
<head>  
    <meta charset="UTF-8">  
    <title>Page Title</title>


    <script> 
    
        //declare canvas globally
        let canvas;

        function Rectangle(x,y,color){
            this.x = x;
            this.y = y;
            this.color = color;


            this.draw = function(){
                const ctx = canvas.getContext("2d");

                ctx.fillStyle = this.color;
                ctx.fillRect(this.x,this.y,50,45);

            }
        }

        function init() {
            console.log("Hello world");
            canvas = document.getElementById("myCanvas");
            var newRectangleInstance = new Rectangle(20, 20, "rgb(0, 255, 0)"); 
            newRectangleInstance.draw();
        }

    </script>
</head>



<body onload="init()">

    <canvas id="myCanvas" width="300" height="200" style="border: 1px solid gray;"></canvas>
    <br>
    <button>
        Change Spawn Color
    </button>

    <p>Frame Count: 0</p>
    <p>Rectangle Count: 0</p>


</body>
</html>
