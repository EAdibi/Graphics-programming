
<!DOCTYPE html>
<html>
    
<head>  
    <meta charset="UTF-8">  
    <title>Page Title</title>

    <script>
        var currentFrameNumber =0;
        var sceneList = [];
        var canvas;
        var RectanglePrototype ={};

        
        RectanglePrototype.update = function(){
            this.velocity.y += 0.5;
            this.y+=this.velocity.y * 0.16;

            this.width = Math.max(5, this.width - 0.01);
            this.height = Math.max(5, this.height - 0.001);
        }
        RectanglePrototype.draw = function(){
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x,this.y,this.width,this.height);
        }

        function Rectangle(x, y, width, height, color){
            this.x = x;
            this.y = y;
            this.width = 10;
            this.height = 10;
            this.color = color;
            this.velocity = {x:0, y:0};

            // this.draw = function(){
            //     const ctx = canvas.getContext("2d");

            //     ctx.fillStyle = this.color;
            //     ctx.fillRect(this.x,this.y,50,45);
            // }

            // this.update = function(){
            //     this.velocity.y +=1;
            //     this.y+=this.velocity.y * 0.16;
            // }
        }

        //set the rectangle obj to inherit the prototype
        Rectangle.prototype = RectanglePrototype;

        function init() {
            console.log("Hello world");
            canvas = document.getElementById("myCanvas");

            //add Rectangle obj to the list array
            sceneList.push(new Rectangle(20,20,50,45,"rgb(0,255,0)"));
            sceneList.push(new Rectangle(80,20,50,45,"rgb(0,255,0)"));
            sceneList.push(new Rectangle(140,20,50,45,"rgb(0,255,0)"));

            // var newRectangleInstance = new Rectangle(20, 20, "rgb(0, 255, 0)"); 
        
            updateAndDraw();
            
            changeColor();
        }


        function updateAndDraw() {
            Math.random();
            const ctx = canvas.getContext("2d");

            //create a rectangle with a random position and color
            const randomx = Math.floor(Math.random() *(canvas.width));
            const randomy = Math.floor(Math.random() *(canvas.height));
            // const randomColor = getRandomColor();
            const fixColor = "rgb(255, 182, 193)";
            sceneList.push(new Rectangle(randomx, randomy, 50, 45,fixColor));
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Iterate through sceneList 
            for (var i = 0; i < sceneList.length; i++) {
                sceneList[i].update();
                sceneList[i].draw();
                if(isRectangleOutOfCanvas(sceneList[i])){
                    sceneList.splice(i,1); // remove the rectangle
                    i--; // it will adjust the index after removing an element from array
                }
            }

            currentFrameNumber++;
            updateStats();
            console.log("Frame Count: ", currentFrameNumber);
            requestAnimationFrame(updateAndDraw);

        }


        function updateStats(){
            var p = document.getElementById("frameCount");
            p.innerText = "Frame Count: " + currentFrameNumber;
            var p = document.getElementById("rectangleCount");
            p.innerText = "Rectangles Count: " + sceneList.length;
        }

        function getRandomColor() {
            var red = Math.floor(Math.random() * 256);   // Random between 0-255
            var green = Math.floor(Math.random() * 256); 
            var blue = Math.floor(Math.random() * 256);  
            return 'rgb(' + red + ', ' + green + ', ' + blue + ')';     
        }

        function isRectangleOutOfCanvas(rectangle){
            return rectangle.y - rectangle.height > canvas.height || 
            rectangle.x - rectangle.width > canvas.width || 
            rectangle.y < -rectangle.height || 
            rectangle.x < -rectangle.width;
        }


        function ChangeSpawnColor(){
            var newColor = getRandomColor()
            for(var i =0; i< sceneList.length; i++){
                sceneList[i].color = newColor ;
            }
        }

        function changeColor(){
            var button = document.getElementById("changeColorButton");
            button.addEventListener("click", ChangeSpawnColor);
        }

    </script>
</head>

<!-- test comment -->


<body onload="init()">

    <canvas id="myCanvas" width="300" height="200" style="border: 1px solid gray;"></canvas>
    <br>
    <button id="changeColorButton">
        Change Spawn Color
    </button>

    <p id ="frameCount">Frame Count: 0</p>
    <p id ="rectangleCount">Rectangle Count: 0</p>


</body>
</html>
