
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Raytracer</title>
</head>
<body>
<canvas id='my-canvas'></canvas>

<script src='math/vector3.js'></script>
<script src='math/ray.js'></script>
<script src='math/sphere.js'></script>
<script src='math/plane.js'></script>
<script>

// Canvas setup, don't need to anything in this section ************************
// Get a reference to the javascript object associated with the canvas
var canvas = document.getElementById('my-canvas');

// The canvas dimension we will set
var pixelsAcross = 256;  // pixels across
var pixelsDown = 256; // pixels down

// Set dimensions and pixel scale (generally you can ignore pixelScale, it won't affect your maths)
var pixelScale = 3;
canvas.width = pixelsAcross;
canvas.height = pixelsDown;
canvas.style.cssText = 'width:' + (pixelsAcross * pixelScale) + 'px;height:' + (pixelsDown * pixelScale) + 'px';

// Get the context from the canvas (in this case we just want 2d)
var canvasContext = canvas.getContext('2d');

// Get an array representing all of the pixels
// Arranged left to right, top to bottom
var imageData = canvasContext.getImageData(0, 0, pixelsAcross, pixelsDown);
// end canvas setup section *****************************************************


// Raytracer scene data setup
var fov = 45;   // if this changes, your code should still work
var fovRadians = fov * Math.PI / 180; // convert degrees to radians

var pixelWidth = 2 / pixelsAcross; // what's the size of a pixel from left to right?
var pixelHalfWidth = pixelWidth / 2; // half of the pixel width

// How far away (scalar) the eye is from the image plane (see project guide for more info)
var eyeDistance = 1 / Math.tan(fovRadians / 2); // related to tangent and field of view
// -----------
// |         /
// |        /
// |       /
// | 45/2 /      <---- half angle
// |     /
// |    /
// |   /
// |  /
// | /

// important vectors
var eyeCoordinate = new Vector3(0, 0, eyeDistance); // all of your rays will use this

// Define the scene objects here ------------------

// These are 3d definitions that match all of the math we did in class
// They also provide a "raycast" function that you can pass a ray to
// in order to find intersection between the ray and the object

var sphere = new Sphere(new Vector3(0, 0, 0), 0.25);// new Sphere(..., ...);
var plane = new Plane(new Vector3(0, 1, 0), new Vector3(0, -0.25, 0)); // new Plane(..., ...);

// end of raytracer setup ******************************************************

// -----------------------------------------------------------------------------
// return a ray that goes from the eye point through the pixel at index (xPixelIndex, yPixelIndex)
function generateRayForPixel(xPixelIndex, yPixelIndex) {
    var pixelX = -1 + pixelHalfWidth + pixelWidth * xPixelIndex;
    var pixelY = 1 - pixelHalfWidth - pixelWidth * yPixelIndex;
    var pixelCoordinate = new Vector3(pixelX, pixelY, 0);

    var direction = new Vector3(pixelCoordinate.x - eyeCoordinate.x, pixelCoordinate.y - eyeCoordinate.y, pixelCoordinate.z - eyeCoordinate.z); // = vector from the eye to the pixel

    direction = direction.normalize();
    
    // Creates a ray from the eye toward the pixelCoordinate
    var pixelRay = new Ray(eyeCoordinate, direction);; // = new Ray(...);
    return pixelRay;
}

// -----------------------------------------------------------------------------
function setPixelColor(xPixelIndex, yPixelIndex, color) { 
    var index = (yPixelIndex * pixelsAcross + xPixelIndex) * 4; 
    imageData.data[index + 0] = color.r * 255; 
    imageData.data[index + 1] = color.g * 255; 
    imageData.data[index + 2] = color.b * 255; 
    imageData.data[index + 3] = 255; 
}

// -----------------------------------------------------------------------------
var sphere = new Sphere(new Vector3(0,0,0), 0.25);
var floor = new Plane(new Vector3(0,1,0), new Vector3(0,-0.25,0));
var leftWall = new Plane(new Vector3(1, 0, 0), new Vector3(-1, 0, 0), {r: 0, g: 1, b: 0});
var rightWall = new Plane(new Vector3(-1, 0, 0), new Vector3(1, 0, 0), {r: 1, g: 0, b: 0});
var ceiling = new Plane(new Vector3(0,-1,0), new Vector3(0,1,0));
var backWall = new Plane(new Vector3(0,0,1), new Vector3(0,0,-1));
var scene = [sphere, ceiling, floor, leftWall, rightWall, backWall];
function updateAndRender(timeElapsed) {

    for (var yPixelIndex = 0; yPixelIndex < pixelsDown; ++yPixelIndex) {

        for (var xPixelIndex = 0; xPixelIndex < pixelsAcross; ++xPixelIndex) {
            var pixelRay = generateRayForPixel(xPixelIndex, yPixelIndex);
            var sphereResult = sphere.raycast(pixelRay);
            var planeResult = plane.raycast(pixelRay);
            var closestHit = null;
            var lightPosition = new Vector3(1, 0, 0);
            var seconds = timeElapsed * 0.001;
            lightPosition.x = Math.cos(seconds) * 0.5;
            lightPosition.z = Math.sin(seconds) * 0.5;

            for (var i = 0; i < scene.length; i++) {
                var result = scene[i].raycast(pixelRay);
                if (result.hit && (!closestHit || result.distance < closestHit.distance)) {
                    closestHit = result;
                    closestHit.object = scene[i];
                }
            }

            if (closestHit) {

                if (closestHit.object instanceof Sphere) {
                    objectColor = {r:1,g:0.75,b:0.8};
                } else {
                    objectColor = closestHit.object.color || { r: 1, g: 1, b: 1 };
                }

                var intersectionPoint = closestHit.point;
                var normal = closestHit.normal;
                var shadowRay = new Ray(intersectionPoint, lightPosition.clone().subtract(intersectionPoint).normalize());
                var sphereShadowResult = sphere.raycast(shadowRay);
                var inShadow = false;

                for (let j = 0; j < scene.length; j++) {

                    if (scene[j] === closestHit.object) continue;
                    var shadowResult = scene[j].raycast(shadowRay);

                    if (shadowResult.hit) {
                        var shadowHitDistance = shadowResult.distance;
                        var lightDistance = lightPosition.clone().subtract(intersectionPoint).length();
                        var lightDirection = lightPosition.clone().subtract(intersectionPoint).normalize();
                        if (shadowHitDistance < lightDistance && shadowHitDistance > 1e-4) {
                            inShadow = true;
                            break;
                        }
                    }
                }

            if (!inShadow) {
                shadeOfGray = Math.max(0, closestHit.normal.dot(lightDirection));
            } else {
                shadeOfGray = 0;
            }
                setPixelColor(xPixelIndex, yPixelIndex, shadeOfGray);
                    objectColor = {
                    r: objectColor.r * shadeOfGray,
                    g: objectColor.g * shadeOfGray,
                    b: objectColor.b * shadeOfGray
                };
            setPixelColor(xPixelIndex, yPixelIndex, objectColor);
            } else {
                setPixelColor(xPixelIndex, yPixelIndex, { r: 0, g: 0, b: 0 });
            }
        }
    }

    canvasContext.putImageData(imageData, 0, 0);
    requestAnimationFrame(updateAndRender);
}
requestAnimationFrame(updateAndRender);
</script>
</body>
</html>
