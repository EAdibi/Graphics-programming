
<!DOCTYPE html>
<html>
    
<head>  
    <meta charset="UTF-8">  
    <title>Page Title</title>


    <script>

        // current frame
        var currentFrameNumber =0;

        // create a global array variable
        var sceneList = [];
    
        //declare canvas globally
        var canvas;

        function Rectangle(x,y,color){
            this.x = x;
            this.y = y;
            this.color = color;


            this.draw = function(){
                const ctx = canvas.getContext("2d");

                ctx.fillStyle = this.color;
                ctx.fillRect(this.x,this.y,50,45);

            }
        }

        function init() {
            console.log("Hello world");
            canvas = document.getElementById("myCanvas");

            //create and add Rectangle obj to the list array
            sceneList.push(new Rectangle(20,20,"rgb(0,255,0)"));
            sceneList.push(new Rectangle(80,20,"rgb(0,255,0)"));
            sceneList.push(new Rectangle(140,20,"rgb(0,255,0)"));

            // var newRectangleInstance = new Rectangle(20, 20, "rgb(0, 255, 0)"); 
            

            //calling updateAndDraw function to draw
            updateAndDraw();
        }



        function updateAndDraw() {
            Math.random();
            const ctx = canvas.getContext("2d");

            //create a rectangle with a random position and color
            const randomx = Math.floor(Math.random() *(canvas.width));
            const randomy = Math.floor(Math.random() *(canvas.height));
            const randomColor = getRandomColor();
            sceneList.push(new Rectangle(randomx, randomy, randomColor));


            // Clear the canvas before drawing
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Iterate through sceneList and call the draw method
            for (var i = 0; i < sceneList.length; i++) {
                sceneList[i].draw();
            }

            currentFrameNumber++;
            updateStats();
            console.log("Frame Count: ", currentFrameNumber);
            requestAnimationFrame(updateAndDraw);

        }


        function updateStats(){
            var p = document.getElementById("frameCount");
            p.innerText = "Frame Count: " + currentFrameNumber;
      
            var p = document.getElementById("rectangleCount");
            p.innerText = "Rectangles Count: " + sceneList.length;
            
        }

        function getRandomColor() {
            var red = Math.floor(Math.random() * 256);   // Random between 0-255
            var green = Math.floor(Math.random() * 256); // Random between 0-255
            var blue = Math.floor(Math.random() * 256);  // Random between 0-255
            return 'rgb(' + red + ', ' + green + ', ' + blue + ')';
}

    </script>
</head>

<!-- test comment -->


<body onload="init()">

    <canvas id="myCanvas" width="300" height="200" style="border: 1px solid gray;"></canvas>
    <br>
    <button>
        Change Spawn Color
    </button>

    <p id ="frameCount">Frame Count: 0</p>
    <p id ="rectangleCount">Rectangle Count: 0</p>


</body>
</html>
